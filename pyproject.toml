[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "movernotch"
version = "0.1.0"
description = "Cross-center reproduction of the second-derivative dicrotic-notch baseline on the public MOVER dataset"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Zhaopeng Wu"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["movernotch"]
